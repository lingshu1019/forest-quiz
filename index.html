<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>森林偽裝高手測驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow field-notebook column; each screen is a page of the notebook, the result is an observation record card */
:root{
  --bg:#EEF2EA;           /* moss-tinted paper */
  --paper:#FBFCF8;
  --ink:#1E2B24;
  --ink-soft:#4E5E55;
  --moss:#2F5D46;
  --moss-deep:#1F4234;
  --leaf:#D9E6D2;
  --amber:#A8641A;
  --amber-soft:#F3E3CB;
  --line:#C9D6C2;
  --shadow:0 1px 0 rgba(30,43,36,.06),0 10px 30px -18px rgba(30,43,36,.35);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A16;--paper:#1A241F;--ink:#E5ECE6;--ink-soft:#A9B8AE;--moss:#8CC4A2;--moss-deep:#6FAE88;--leaf:#24342B;--amber:#E2A85C;--amber-soft:#3A2C1A;--line:#2E3F35;--shadow:0 10px 30px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121A16;--paper:#1A241F;--ink:#E5ECE6;--ink-soft:#A9B8AE;--moss:#8CC4A2;--moss-deep:#6FAE88;--leaf:#24342B;--amber:#E2A85C;--amber-soft:#3A2C1A;--line:#2E3F35;--shadow:0 10px 30px -18px rgba(0,0,0,.7);color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:clamp(30px,8vw,40px);color:var(--moss-deep)}
h2{font-size:clamp(21px,5.4vw,25px)}
#qt{font-size:clamp(18px,4.6vw,21px);line-height:1.65;font-weight:400}
p{margin:0}
.lead{color:var(--ink-soft)}
.btn{line-height:1.25;appearance:none;border:0;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;padding:13px 22px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--moss);color:var(--paper)}
.btn-primary:hover{background:var(--moss-deep)}
.btn-ghost{background:transparent;color:var(--moss);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--moss)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* intro */
.hero-wrap{margin:-28px -24px 0;border-radius:14px 14px 0 0;overflow:hidden;line-height:0}
.hero{width:100%;height:auto;display:block}
.peek{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:14px;color:var(--ink-soft);margin-top:-6px}
.peek .linkbtn{color:var(--amber);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#rings[hidden]{display:none}
.meta{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 14px}

/* question */
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--leaf);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .25s ease}
.qnum{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.scene{font-size:13px;color:var(--amber);font-weight:700;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:52px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.opt:hover{border-color:var(--moss)}
.opt[aria-pressed="true"]{border-color:var(--moss);background:var(--leaf)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--moss);padding-top:2px;flex:none;width:16px}
.nav{display:flex;justify-content:space-between;align-items:center}
.linkbtn{appearance:none;background:none;border:0;font:inherit;color:var(--ink-soft);cursor:pointer;padding:10px 4px;min-height:44px}
.linkbtn:disabled{opacity:.35;cursor:default}

/* result card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card figure{margin:0;position:relative}
.card figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.credit{position:absolute;right:10px;bottom:10px;font-size:11px;background:rgba(251,252,248,.88);color:#3d4a43;padding:2px 8px;border-radius:99px}
.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px}
.rname{font-size:clamp(32px,9vw,42px);color:var(--moss-deep)}
.quip{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.5}
.trait{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 12px;border-top:1px dashed var(--line);padding-top:14px}
.trait dt{font-size:13px;font-weight:700;color:var(--amber);padding-top:3px}
.trait dd{margin:0 0 8px}
.record{background:var(--leaf);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.record .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--moss)}
.record .place{font-weight:700;font-size:17px}
.record .note{font-size:14px;color:var(--ink-soft)}
.pair{display:flex;align-items:center;gap:12px;font-size:14px}
.pair img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.cta{background:var(--amber-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cta strong{font-family:var(--display);font-size:18px}
.toast{font-size:13px;color:var(--moss);min-height:1.2em}
.others{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.other{display:flex;flex-direction:column;gap:4px;font-size:13px;text-align:center;color:var(--ink-soft)}
.other img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.foot{font-size:12px;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

    var frog='<g id="c-frog" transform="translate(500,96)">'+
      '<ellipse cx="0" cy="8" rx="30" ry="15" fill="#8CBF73"/>'+

      '<path d="M-20,10 Q0,16 18,10" stroke="#5E8F4E" stroke-width="1.2" fill="none"/>'+

      '<circle cx="28" cy="-1" r="5.2" fill="#D9A35B"/><ellipse cx="28" cy="-1" rx="1.1" ry="4.2" fill="#1E2B24"/>'+
      '<path d="M24,-6 l3,-5 l3,5" fill="#8C7A62"/>'+
    '</g>';
    var beetle='<g id="c-beetle" transform="translate(488,350) rotate(28)">'+
      '<path d="M-10,-12 l-7,-6 M10,-12 l7,-6 M-12,0 l-10,0 M12,0 l10,0 M-10,12 l-8,7 M10,12 l8,7" stroke="#3B1F14" stroke-width="2" stroke-linecap="round"/>'+
      '<ellipse cx="0" cy="4" rx="13" ry="17" fill="#6B2E1F"/>'+

      '<path d="M0,-20 C-2,-30 2,-36 -3,-44 M-3,-44 l-5,-3 M-3,-44 l3,-6" stroke="#4A1F14" stroke-width="3" stroke-linecap="round" fill="none"/>'+
    '</g>';
    var rings='<g id="rings" fill="none" stroke="#F2C46D" stroke-width="3" stroke-dasharray="6 5" hidden>'+
      '<ellipse cx="118" cy="82" rx="70" ry="26" transform="rotate(-10 118 82)"/><circle cx="498" cy="94" r="40"/><circle cx="100" cy="350" r="48"/><circle cx="486" cy="345" r="42"/></g>';
    var title='<g>'+
      '<path d="M120,176 C160,146 440,140 482,170 C510,196 506,262 478,284 C430,312 172,314 124,288 C96,266 94,200 120,176Z" fill="#FBFCF8" opacity=".94"/>'+

        ['森','林','偽','裝','高','手'].map(function(c,k){var r=[-5,3,-2,4,-4,2][k],dy=[0,-3,2,-2,3,-1][k];return '<tspan rotate="'+r+'" dy="'+dy+'">'+c+'</tspan>';}).join('')+

      '<rect width="600" height="420" fill="#16362A"/>'+back+stick+frog+gecko+beetle+front+rings+title+'</svg>';
  }

  function intro(){
    app.innerHTML=
      '<section class="page">'+
        '<div class="hero-wrap">'+heroSVG()+'</div>'+
        '<div class="peek"><span>畫面裡躲了 4 隻生物，你找得到嗎？</span><button class="linkbtn" id="peek" type="button" aria-pressed="false">偷看答案</button></div>'+
        '<p class="eyebrow">熱血阿傑的自然生態日記簿・趣味測驗</p>'+
        '<h1 class="sr">你是哪一種森林偽裝高手？</h1>'+
        '<p class="lead">每個人都有一套在人群裡保護自己的方式。回答 12 個生活裡的小情境，找出你的本命偽裝生物，還可以知道要去哪裡找到牠！</p>'+
        '<div class="meta"><span>12 道趣味問題，請憑直覺選出最接近你的想法的答案喔！</span></div>'+
        '<div class="row"><button class="btn btn-primary" id="start" type="button">開始測驗</button></div>'+
      '</section>'+
      '<p class="foot">《熱血阿傑的自然生態日記簿》2026/11/23 上市｜散冊出版</p>';
    document.getElementById('start').onclick=start;
    var pk=document.getElementById('peek');
    pk.onclick=function(){var r=app.querySelector('#rings');var on=r.hasAttribute('hidden');if(on){r.removeAttribute('hidden');}else{r.setAttribute('hidden','');}pk.setAttribute('aria-pressed',on?'true':'false');pk.textContent=on?'收起答案':'偷看答案';};
  }

  function start(){
    order=Q.map(function(q){return shuffle(q.o.slice());});
    answers=new Array(Q.length); cur=0; question();
  }

  function question(){
    var q=Q[cur], opts=order[cur], keys='ABCD';
    app.innerHTML=
      '<section class="page">'+
        '<div class="progress"><span class="qnum">Q'+String(cur+1).padStart(2,'0')+' / '+Q.length+'</span><div class="bar"><span style="width:'+((cur)/Q.length*100)+'%"></span></div></div>'+
        '<h2 id="qt">'+esc(q.q)+'</h2>'+
        '<div class="opts" role="group" aria-labelledby="qt">'+
          opts.map(function(o,i){return '<button class="opt" type="button" id="opt'+i+'" data-i="'+i+'" aria-pressed="'+(answers[cur]===o[1]+'|'+i?'true':'false')+'"><span class="k">'+keys[i]+'</span><span>'+esc(o[0])+'</span></button>';}).join('')+
        '</div>'+
        '<div class="nav"><button class="linkbtn" id="prev" type="button"'+(cur===0?' disabled':'')+'>← 上一題</button><span class="qnum">'+(cur+1===Q.length?'最後一題':'')+'</span></div>'+
      '</section>';
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
      b.onclick=function(){
        var i=+b.getAttribute('data-i'); answers[cur]=opts[i][1]+'|'+i;
        Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(x){x.setAttribute('aria-pressed','false');});
        b.setAttribute('aria-pressed','true');
        setTimeout(function(){ if(cur<Q.length-1){cur++;question();} else result(); },180);
      };
    });
    document.getElementById('prev').onclick=function(){ if(cur>0){cur--;question();} };
    var first=app.querySelector('.opt'); if(first) first.focus({preventScroll:true});
  }

  function score(){
    var c={}, last={};
    answers.forEach(function(a,qi){var k=a.split('|')[0]; c[k]=(c[k]||0)+1; last[k]=qi;});
    var best=null;
    ORDER.forEach(function(k){ if(!c[k]) return;
      if(!best || c[k]>c[best] || (c[k]===c[best] && last[k]>last[best])) best=k; });
    return best;
  }

  function result(){
    var k=score(), t=T[k], p=T[t.pair];
    var shareText='我測出來是「'+t.name+'」：'+t.quip+' 你是哪一種森林偽裝高手？';
    app.innerHTML=
      '<article class="card">'+
        '<figure><img src="'+t.img+'" alt="'+esc(t.name)+'"><figcaption class="credit">攝影｜黃仕傑</figcaption></figure>'+
        '<div class="card-body">'+
          '<p class="eyebrow">你的本命偽裝生物</p>'+
          '<h2 class="rname">'+esc(t.name)+'</h2>'+
          '<p class="quip">'+esc(t.quip)+'</p>'+
          '<dl class="trait">'+
            '<dt>你的偽裝術</dt><dd>'+esc(t.mask)+'</dd>'+
            '<dt>被看見的時刻</dt><dd>'+esc(t.shine)+'</dd>'+
            '<dt>森林給你的話</dt><dd>'+esc(t.tip)+'</dd>'+
          '</dl>'+
          '<div class="record">'+
            '<span class="tag">本命走讀點・書中 '+esc(t.page)+'</span>'+
            '<span class="place">'+esc(t.place)+'</span>'+
            '<span class="note">'+esc(t.note)+'</span>'+
          '</div>'+
          '<div class="pair"><img src="'+p.img+'" alt=""><span>最合拍的夥伴：<b>'+esc(p.name)+'</b>。'+esc(t.pairWhy)+'</span></div>'+
          '<div class="cta">'+
            '<strong>你身邊那個人，是哪一種？</strong>'+
            '<span>傳給同事、朋友或另一半，看看你們是不是最合拍的那一對。</span>'+
            '<div class="row">'+
              '<button class="btn btn-primary" id="share" type="button">把測驗傳給那個你想到的人</button>'+
              '<button class="btn btn-ghost" id="again" type="button">再測一次</button>'+
            '</div>'+
            '<p class="toast" id="toast" role="status"></p>'+
          '</div>'+
          '<div class="record">'+
            '<span class="tag">熱血阿傑的自然生態日記簿・2026/11/23 上市</span>'+
            '<span>書裡有 41 個台灣走讀點，還有更多偽裝高手，等你親自去找。</span>'+
            '<div class="row"><a class="btn btn-ghost" href="'+BOOK_URL+'" target="_blank" rel="noopener">看看這本書</a></div>'+
          '</div>'+
        '</div>'+
      '</article>'+
      '<p class="foot">《熱血阿傑的自然生態日記簿》2026/11/23 上市｜散冊出版</p>';
    document.getElementById('again').onclick=function(){intro();window.scrollTo(0,0);};
    document.getElementById('share').onclick=function(){
      var text=shareText+(SHARE_URL?' '+SHARE_URL:'');
      var toast=document.getElementById('toast');
      try{
        navigator.clipboard.writeText(text).then(function(){toast.textContent='已複製分享文字，貼給他吧。';},function(){toast.textContent=text;});
      }catch(e){toast.textContent=text;}
    };
    window.scrollTo(0,0);
  }

  intro();
})();
</script>
